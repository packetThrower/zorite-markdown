name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore", ".github/dependabot.yml"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore", ".github/dependabot.yml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      # Actions are pinned to a commit SHA; Dependabot bumps the SHA and the
      # trailing version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2

      - name: cargo fmt --check
        if: matrix.runner == 'ubuntu-latest'
        run: cargo fmt --check

      # gpui's compile-time pkg-config deps on Linux.
      - name: Install Linux deps
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcb-randr0-dev libxcb-xkb-dev \
            libxcb-cursor-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-render0-dev libfontconfig1-dev libfreetype-dev pkg-config

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features
